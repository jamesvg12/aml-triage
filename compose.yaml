services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aml
      POSTGRES_DB: aml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: [ "5432:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./monitoring/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  pushgateway:
    image: prom/pushgateway
    ports: [ "9091:9091" ]

  prometheus:
    image: prom/prometheus
    ports: [ "9090:9090" ]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana
    ports: [ "3000:3000" ]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro

  scorer:
    # the nightly batch job: `docker compose run --rm scorer`
    build: .
    image: aml-triage:0.2.0
    profiles: [ "batch" ]
    user: "1000:1000"
    environment:
      DATABASE_URL: postgresql://aml:${POSTGRES_PASSWORD}@db:5432/aml
      PUSHGATEWAY_URL: pushgateway:9091
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on: [ db, pushgateway ]

volumes:
  pgdata:
