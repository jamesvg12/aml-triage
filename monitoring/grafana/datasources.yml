apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Postgres
    type: grafana-postgresql-datasource
    url: db:5432
    user: aml
    jsonData: {database: aml, sslmode: disable}
    secureJsonData: {password: $POSTGRES_PASSWORD}
